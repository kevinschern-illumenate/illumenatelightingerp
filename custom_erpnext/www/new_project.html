{% extends "templates/web.html" %}

{% block page_content %}
<div class="container">
	<div class="row mb-4">
		<div class="col-12">
			<nav aria-label="breadcrumb">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="/projects">Projects</a></li>
					<li class="breadcrumb-item active">New Project</li>
				</ol>
			</nav>
		</div>
	</div>

	{% if error %}
	<div class="alert alert-danger">
		{{ error }}
	</div>
	<a href="/projects" class="btn btn-secondary">
		<i class="fa fa-arrow-left"></i> Back to Projects
	</a>
	{% else %}
	<div class="row">
		<div class="col-md-8">
			<div class="card">
				<div class="card-header">
					<h2 class="mb-0">Create New Project</h2>
				</div>
				<div class="card-body">
					<form id="new-project-form">
						<div class="form-group">
							<label for="project_name">Project Name <span class="text-danger">*</span></label>
							<input type="text" class="form-control" id="project_name" name="project_name" required>
						</div>

						<div class="form-group">
							<label for="project_code">Project Code</label>
							<input type="text" class="form-control" id="project_code" name="project_code" placeholder="Optional reference code">
						</div>

						<div class="form-group">
							<label for="description">Description</label>
							<textarea class="form-control" id="description" name="description" rows="3" placeholder="Optional project description"></textarea>
						</div>

						<div class="row">
							<div class="col-md-6">
								<div class="form-group">
									<label for="expected_start_date">Expected Start Date</label>
									<input type="date" class="form-control" id="expected_start_date" name="expected_start_date">
								</div>
							</div>
							<div class="col-md-6">
								<div class="form-group">
									<label for="expected_end_date">Expected End Date</label>
									<input type="date" class="form-control" id="expected_end_date" name="expected_end_date">
								</div>
							</div>
						</div>

						<div class="form-group mb-0">
							<button type="button" id="btn-create-project" class="btn btn-primary">
								<i class="fa fa-save"></i> Create Project
							</button>
							<a href="/projects" class="btn btn-secondary">
								Cancel
							</a>
						</div>
					</form>
				</div>
			</div>
		</div>

		<div class="col-md-4">
			<div class="card">
				<div class="card-header">
					<h5 class="mb-0">Customer</h5>
				</div>
				<div class="card-body">
					<p class="mb-0"><strong>{{ customer_name }}</strong></p>
				</div>
			</div>
		</div>
	</div>
	{% endif %}
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
	var createBtn = document.getElementById('btn-create-project');
	if (createBtn) {
		createBtn.addEventListener('click', function(e) {
			e.preventDefault();
			
			var project_name = document.getElementById('project_name').value;
			if (!project_name) {
				frappe.msgprint('Project Name is required');
				return;
			}

			frappe.call({
				method: 'custom_erpnext.illumenate_configurator.api.create_project',
				args: {
					project_name: project_name,
					project_code: document.getElementById('project_code').value || null,
					description: document.getElementById('description').value || null,
					expected_start_date: document.getElementById('expected_start_date').value || null,
					expected_end_date: document.getElementById('expected_end_date').value || null
				},
				freeze: true,
				freeze_message: 'Creating Project...',
				callback: function(r) {
					if (r.message) {
						frappe.msgprint({
							title: 'Success',
							indicator: 'green',
							message: 'Project "' + r.message.project_name + '" created successfully!'
						});
						setTimeout(function() {
							window.location.href = '/project?name=' + r.message.name;
						}, 1500);
					} else {
						frappe.msgprint({
							title: 'Error',
							indicator: 'red',
							message: 'Failed to create project. Please try again.'
						});
					}
				},
				error: function(r) {
					var error_message = 'Failed to create project. Please try again.';
					if (r && r.responseJSON && r.responseJSON._server_messages) {
						try {
							var messages = JSON.parse(r.responseJSON._server_messages);
							if (messages.length > 0) {
								error_message = JSON.parse(messages[0]).message || error_message;
							}
						} catch (e) {
							// Use default error message
						}
					}
					frappe.msgprint({
						title: 'Error',
						indicator: 'red',
						message: error_message
					});
				}
			});
		});
	}
});
</script>
{% endblock %}
